# Mathéo on a desktop, Windows and Linux (scripts/smoke/): started, hovered, thrown, his menu opened,
# a screenshot at each step, his journal kept; all in the run's artifacts (smoke-windows, smoke-linux).
# One screen, no real graphics card (Windows: WARP; Linux: Xvfb, Mesa's software drivers).
# Also Windows over three screens at different scales (multi-screen). Started by hand: gh workflow
# run smoke.yml [--ref a-branch].
name: Smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libxkbcommon-x11-0 xvfb openbox picom xdotool imagemagick xterm x11-xserver-utils x11-utils mesa-vulkan-drivers libegl1 libgl1-mesa-dri

      - name: Build
        run: cargo build --locked

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke/windows.ps1

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/smoke/linux.sh

      - name: Journal
        if: always()
        shell: bash
        run: cat smoke-out/matheo.log smoke-out/stderr.log 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: smoke-${{ matrix.name }}
          path: smoke-out/

  # Windows with three screens at different scales (125 %, 100 %, 100 %), as on our laptops: a
  # virtual display driver, then Mathéo carried from screen to screen (scripts/smoke/windows-multi.ps1).
  multi-screen:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build
        run: cargo build --locked

      - name: Screens
        shell: pwsh
        run: ./scripts/smoke/displays.ps1 -Add 2 -Scales 125,100,100

      - name: Smoke test over the screens
        shell: pwsh
        run: ./scripts/smoke/windows-multi.ps1

      - name: Journal
        if: always()
        shell: bash
        run: cat smoke-out/matheo.log 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: smoke-multi-screen
          path: smoke-out/
